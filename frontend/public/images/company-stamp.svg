<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="130" height="130">
  <!-- Outer double ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.85" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.75" />
  
  <!-- Curved text top and bottom -->
  <defs>
    <path id="circlePathTop" d="M 22,100 A 78,78 0 1,1 178,100" />
    <path id="circlePathBottom" d="M 178,100 A 78,78 0 0,1 22,100" />
  </defs>

  <text font-family="'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#2563eb" opacity="0.88" letter-spacing="2">
    <textPath href="#circlePathTop" startOffset="50%" text-anchor="middle">
