  <circle cx="100" cy="100" r="48" fill="rgba(37, 99, 235, 0.04)" />
  <polygon points="100,68 104,78 114,80 107,87 109,97 100,92 91,97 93,87 86,80 96,78" fill="#2563eb" opacity="0.7" />
  <text x="100" y="112" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.5" opacity="0.85">AUTHORIZED</text>
  <text x="100" y="123" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.5" opacity="0.85">SIGNATORY</text>
